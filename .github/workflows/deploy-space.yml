name: Deploy Hugging Face Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade huggingface_hub
      - name: Create free static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf repos create zubairz4far/qwen3-tool-calling-demo --type space --space-sdk static --exist-ok
      - name: Upload portfolio showcase
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload zubairz4far/qwen3-tool-calling-demo static-space . --repo-type space --commit-message "Deploy Qwen3 tool-calling portfolio showcase"
