name: Deploy Hugging Face Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub

      - name: Create Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf repos create zubairz4far/qwen3-tool-calling-demo \
            --type space \
            --space-sdk gradio \
            --exist-ok

      - name: Upload Space application
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload zubairz4far/qwen3-tool-calling-demo space . \
            --repo-type space \
            --commit-message "Deploy interactive Qwen3 tool-calling demo"
